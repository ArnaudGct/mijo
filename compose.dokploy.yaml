services:
  app:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "node scripts/migrate.mjs && exec node server.js"]
    env_file:
      - ${MIJO_ENV_FILE:-/etc/dokploy/mijo-private/app.env}
    environment:
      APP_ORIGIN: https://mijo.arnaudgct.fr
      MEDIA_DIR: /data/media
    volumes:
      - media:/data/media
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  media:
    name: mijo-production-media
    external: true
